events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    upstream patient_portal {
        server patient-portal:3000;
    }

    upstream hospital_hms {
        server hospital-hms:3000;
    }

    upstream admin_panel {
        server admin-panel:3000;
    }

    upstream api_gateway {
        server api-gateway:4002;
    }

    upstream ai_docs {
        server ai-docs:4003;
    }

    server {
        listen 80;
        server_name localhost;

        # API Gateway Routes
        location /api/metrics {
            deny all;
            return 403;
        }

        location /api/ {
            proxy_pass http://api_gateway/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_addrs;
        }

        # Hospital HMS App
        location /hospital {
            proxy_pass http://hospital_hms;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Admin Panel
        location /admin {
            proxy_pass http://admin_panel;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Patient Portal (Root App)
        location / {
            proxy_pass http://patient_portal;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # AI Documentation Service
        location /ai-docs/ {
            proxy_pass http://ai_docs/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
