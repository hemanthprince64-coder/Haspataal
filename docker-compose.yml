version: '3.9'

networks:
  haspataal_network:
    driver: bridge

volumes:
  redis_data:
  postgres_data:

services:
  # ================================================================
  # FRONTENDS — Next.js portals
  # ================================================================
  # ================================================================
  # FRONTENDS — Next.js portals
  # ================================================================
  patient-portal:
    image: haspataal/patient-portal:latest
    build: 
      context: .
      dockerfile: apps/patient-portal/Dockerfile
    container_name: patient-portal
    restart: unless-stopped
    env_file: .env.local
    ports:
      - '3000:3000'
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/api/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - haspataal_network

  # haspataal-in and admin-panel would be updated similarly if they existed in apps/
  # haspataal-in is likely hospital-hms now
  hospital-hms:
    image: haspataal/hospital-hms:latest
    build:
      context: .
      dockerfile: apps/hospital-hms/Dockerfile
    container_name: hospital-hms
    restart: unless-stopped
    env_file: .env.local
    ports:
      - '3001:3000'
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    networks:
      - haspataal_network

  admin-panel:
    image: haspataal/admin-panel:latest
    build:
      context: .
      dockerfile: apps/admin-panel/Dockerfile
    container_name: admin-panel
    restart: unless-stopped
    env_file: .env.local
    ports:
      - '3002:3000'
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    networks:
      - haspataal_network

  # ================================================================
  # BACKEND MICROSERVICES
  # ================================================================
  auth-service:
    image: haspataal/auth-service:latest
    build: ./services/auth
    container_name: auth-service
    restart: unless-stopped
    env_file: .env.local
    ports:
      - '4001:4001'
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:4001/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - haspataal_network

  api-gateway:
    image: haspataal/api-gateway:latest
    build: ./services/gateway
    container_name: api-gateway
    restart: unless-stopped
    env_file: .env.local
    ports:
      - '4002:4002'
    depends_on:
      auth-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - haspataal_network
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:4002/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ================================================================
  # INFRASTRUCTURE
  # ================================================================
  postgres:
    image: postgres:16-alpine
    container_name: haspataal-postgres
    restart: unless-stopped
    env_file: .env.local
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    networks:
      - haspataal_network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d haspataal']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: haspataal-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - '6379:6379'
    networks:
      - haspataal_network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  db-migrate:
    image: node:18-alpine
    container_name: db-migrate
    working_dir: /app
    volumes:
      - .:/app
    env_file: .env.local
    command: /bin/sh -c "npm install -g prisma && prisma generate && prisma migrate deploy"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - haspataal_network

  # AI Documentation Microservice (port 4003)
  ai-docs:
    build: ./services/ai-docs
    container_name: ai-docs
    restart: unless-stopped
    env_file: .env.local
    ports:
      - '4003:4003'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - haspataal_network
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:4003/api/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  nginx:
    image: nginx:alpine
    container_name: haspataal-nginx
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - '80:80'
    depends_on:
      - patient-portal
      - hospital-hms
      - admin-panel
      - api-gateway
      - auth-service
      - escalation-worker
    networks:
      - haspataal_network

  # ================================================================
  # WORKERS — background / cron daemons
  # ================================================================
  escalation-worker:
    image: haspataal/escalation-worker:latest
    build:
      context: .
      dockerfile: workers/Dockerfile
    container_name: escalation-worker
    restart: unless-stopped
    env_file: .env.local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - haspataal_network

