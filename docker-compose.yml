version: '3.9'

networks:
  haspataal_network:
    driver: bridge

volumes:
  redis_data:
  postgres_data:

services:
  # ================================================================
  # FRONTENDS — Next.js portals
  # ================================================================
  patient-portal:
    image: haspataal/patient-portal:latest
    build: .
    container_name: patient-portal
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=http://api-gateway:4002
      - NEXT_PUBLIC_AUTH_URL=http://auth-service:4001
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/haspataal?schema=public
    ports:
      - "3000:3000"
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    networks:
      - haspataal_network

  haspataal-in:
    image: haspataal/hospital-hms:latest
    build: ./hospital-hms
    container_name: hospital-hms
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=http://api-gateway:4002
      - NEXT_PUBLIC_AUTH_URL=http://auth-service:4001
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/haspataal?schema=public
    ports:
      - "3001:3000"
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    networks:
      - haspataal_network

  haspataal-admin:
    image: haspataal/admin-panel:latest
    build: ./haspataal-admin
    container_name: admin-panel
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=http://api-gateway:4002
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/haspataal?schema=public
    ports:
      - "3002:3000"
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    networks:
      - haspataal_network

  # ================================================================
  # BACKEND MICROSERVICES
  # ================================================================
  auth-service:
    image: haspataal/auth-service:latest
    build: ./auth-service
    container_name: auth-service
    restart: unless-stopped
    environment:
      - AUTH_SERVICE_PORT=4001
      - NEXTAUTH_SECRET=supersecretlocal
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/haspataal?schema=public
    ports:
      - "4001:4001"
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    networks:
      - haspataal_network

  api-gateway:
    image: haspataal/api-gateway:latest
    build: ./api-gateway
    container_name: api-gateway
    restart: unless-stopped
    environment:
      - API_GATEWAY_PORT=4002
      - NEXTAUTH_SECRET=supersecretlocal
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/haspataal?schema=public
      - REDIS_URL=redis://redis:6379
    ports:
      - "4002:4002"
    depends_on:
      auth-service:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - haspataal_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ================================================================
  # INFRASTRUCTURE
  # ================================================================
  postgres:
    image: postgres:16-alpine
    container_name: haspataal-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=haspataal
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - haspataal_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d haspataal"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: haspataal-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - haspataal_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  db-migrate:
    image: node:18-alpine
    container_name: db-migrate
    working_dir: /app
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/haspataal?schema=public
    command: /bin/sh -c "npm install -g prisma && prisma generate && prisma migrate deploy"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - haspataal_network

  nginx:
    image: nginx:alpine
    container_name: haspataal-nginx
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - patient-portal
      - haspataal-in
      - haspataal-admin
      - api-gateway
      - auth-service
    networks:
      - haspataal_network
