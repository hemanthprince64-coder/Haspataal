# Search APIs - Complete OpenAPI 3.1 Specification

## Info
```yaml
openapi: 3.1.0
info:
  title: Haspataal Unified Search & Discovery API
  version: 1.0.0
  description: Universal search across all healthcare entities
```

## Authentication
```yaml
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    sessionAuth:
      type: apiKey
      in: cookie
      name: sessionId
```

## Universal Search Endpoint
```yaml
  /api/search:
    get:
      security:
        - bearerAuth: []
      summary: Universal search across all entities
      operationId: universalSearch
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            maxLength: 500
          description: Search query text
        - name: types
          in: query
          schema:
            type: string
            description: Comma-separated entity types filter
        - name: hospital_id
          in: query
          schema:
            type: string
            format: uuid
        - name: date_from
          in: query
          schema:
            type: string
            format: date-time
        - name: date_to
          in: query
          schema:
            type: string
            format: date-time
        - name: status
          in: query
          schema:
            type: string
          description: Entity status filter
        - name: sort
          in: query
          schema:
            type: string
            enum: [relevance, created_at, updated_at, name]
            default: relevance
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
```

## Patient Search
```yaml
  /api/search/patient:
    get:
      security:
        - bearerAuth: []
      summary: Search patients
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: status
          in: query
          schema:
            type: string
        - name: age_group
          in: query
          schema:
            type: string
            enum: [pediatric, adult, senior]
      responses:
        '200':
          description: Patient search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientSearchResponse'
```

