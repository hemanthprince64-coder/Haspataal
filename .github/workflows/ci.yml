name: Haspataal CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci
      - name: Run Prisma Generate
        run: npx prisma generate
      - name: Prettier Check
        run: npm run format:check
      - name: ESLint
        run: npm run lint:all
      - name: TypeScript Compile Check
        run: npx tsc --noEmit

  schema-safety:
    name: Schema Safety Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci
      - name: Validate Schema
        run: npx prisma validate
      - name: Check for migrations
        run: |
          if git diff --name-only origin/main | grep "prisma/schema.prisma"; then
            echo "Schema modified. Checking if migration exists..."
            if ! git diff --name-only origin/main | grep "prisma/migrations"; then
              echo "::error::Schema was modified but no migration was found. Please run 'npx prisma migrate dev'."
              exit 1
            fi
          fi

  test:
    name: Unit & Integration Tests
    needs: [quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci
      - name: Run Tests with Coverage
        run: npm run test:coverage
        # Fails if coverage drops below 80% (configured in vitest.config.ts)
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  security:
    name: Security Audit & Secrets Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
      - name: NPM Audit
        run: npm audit --audit-level=high
      - name: TruffleHog Secrets Scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified

  build:
    name: Build Apps
    needs: [test, security]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [haspataal, haspataal-in, haspataal-admin]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci
      - name: Run Prisma Generate
        run: npx prisma generate
      - name: Build
        run: npx turbo run build --filter=${{ matrix.app }}
