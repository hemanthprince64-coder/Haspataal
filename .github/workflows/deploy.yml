name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches: [main]

jobs:
  build-images:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: patient-portal
            context: .
          - service: hospital-hms
            context: ./hospital-hms
          - service: admin-panel
            context: ./haspataal-admin
          - service: auth-service
            context: ./auth-service
          - service: api-gateway
            context: ./api-gateway
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase Repository Name
        id: repo
        run: echo "NAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.NAME }}/haspataal-${{ matrix.service }}:${{ github.sha }}
            ghcr.io/${{ steps.repo.outputs.NAME }}/haspataal-${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    needs: build-images
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Deploy to Staging
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: staging.haspataal.in
          username: deploy
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd /opt/haspataal
            export GITHUB_SHA=${{ github.sha }}
            docker compose pull
            docker compose up -d --no-build
      
      - name: Smoke Test
        run: |
          # Verify health endpoint returns 200/207
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://staging.haspataal.in/api/health)
          if [[ "$STATUS" != "200" && "$STATUS" != "207" ]]; then
            echo "Health check failed with status: $STATUS"
            exit 1
          fi

      - name: Auto-Rollback on Failure
        if: failure()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: staging.haspataal.in
          username: deploy
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd /opt/haspataal
            # Revert to previous stable version (assuming a tag/backup strategy)
            docker compose up -d --no-build # Simplified for demonstration
            echo "Deployment failed. Rolling back to previous state."

  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://haspataal.in
    # NOTE: requires 'required_reviewers' configured in GitHub Environment settings
    steps:
      - name: Deploy to Production
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: haspataal.in
          username: deploy
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /opt/haspataal
            export GITHUB_SHA=${{ github.sha }}
            docker compose pull
            docker compose up -d --no-build
      
      - name: Production E2E Smoke Tests
        run: |
          # Run the 3 most critical E2E journeys
          npm run test:e2e -- --grep "@smoke"

      - name: Update Deployment Status
        if: always()
        uses: chrnorm/deployment-status@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          environment-url: https://haspataal.in
          state: ${{ job.status }}
          deployment-id: ${{ github.event.deployment.id }}
