name: Nightly Maintenance

on:
  schedule:
    # 2:00 AM IST is 20:30 UTC
    - cron: '30 20 * * *'
  workflow_dispatch:

jobs:
  full-e2e-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      
      - name: Run Full E2E Suite
        run: npx playwright test
        env:
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: NPM Security Audit
        id: audit
        run: |
          npm audit --audit-level=high --json > audit-report.json || true
      
      - name: Check for Critical Vulnerabilities
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('audit-report.json')) {
              const report = JSON.parse(fs.readFileSync('audit-report.json', 'utf8'));
              const high = report.metadata?.vulnerabilities?.high || 0;
              const critical = report.metadata?.vulnerabilities?.critical || 0;
              
              if (high > 0 || critical > 0) {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: `🚨 Nightly Security Alert: ${high + critical} vulnerabilities found`,
                  body: `High: ${high}\nCritical: ${critical}\n\nPlease run \`npm audit fix\` and review the attached report in workflow artifacts.`,
                  labels: ['security', 'automated-alert']
                });
              }
            }

  sbom-generation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate SBOM (Software Bill of Materials)
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ github.repository }}/haspataal-patient-portal:latest
          format: spdx-json
          output-file: ./haspataal-sbom.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: ./haspataal-sbom.spdx.json
