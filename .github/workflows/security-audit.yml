name: Weekly Security Audit

on:
  schedule:
    - cron: '0 0 * * 1' # Every Monday at 00:00

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install dependencies
        run: npm ci
      - name: Run NPM Audit
        run: npm audit --audit-level=moderate
